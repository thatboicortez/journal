<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Journal</title>
    <link rel="stylesheet" href="styles.css?v=trader-card-21" />
  </head>
  <body>
    <main class="journal-page">
      <section class="trader-card" aria-label="Trader journal card">
        <header class="card-header">
          <div class="trader-profile">
            <span class="avatar">
              <span class="avatar-fallback" aria-hidden="true"></span>
              <img
                id="traderAvatar"
                src="assets/trader/trademark830am.png?v=avatar-1"
                width="62"
                height="62"
                alt="trademark830am profile photo"
              />
            </span>
            <div>
              <p class="label">Trader</p>
              <h1 id="traderName">trademark830am</h1>
            </div>
          </div>

          <div class="month-title" id="journalPeriod">May 2026</div>

          <div class="stats-strip" aria-label="Journal stats">
            <div class="stat">
              <span>Positions</span>
              <strong id="tradeCount">0</strong>
            </div>
            <div class="stat">
              <span>Winrate</span>
              <strong id="winRate">0%</strong>
            </div>
          </div>
        </header>

        <div class="journal-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">Date</th>
                  <th scope="col">Pair</th>
                  <th scope="col">Direction</th>
                  <th scope="col" class="rr-column">RR</th>
                </tr>
              </thead>
              <tbody id="tradeRows"></tbody>
            </table>
          </div>

          <section class="rr-summary" aria-label="RR summary">
            <div class="summary-title">
              <p class="label">Monthly result</p>
              <h2>Risk to reward summary</h2>
              <div
                class="equity-chart"
                id="equityCurve"
                aria-label="Equity curve"
              ></div>
            </div>

            <div class="rr-ledger" id="rrLedger"></div>
          </section>
        </div>
      </section>
    </main>

    <script src="app.js?v=trader-card-21"></script>
  </body>
</html>
